# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=false
org.gradle.java.home=/opt/homebrew/opt/openjdk@25
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# R8 full mode can strip generic signatures needed by Retrofit's Kotlin coroutine (suspend
# function) support, especially for nested generic response wrappers like HydraCollection<T>.
# Retrofit's maintainer confirms static keep rules can't reliably fix every case; disabling
# full mode is the recommended fallback. See https://github.com/square/retrofit/discussions/4173
android.enableR8.fullMode=false
# AGP-recommended suppression for two warnings we've deliberately decided not to
# "fix": UNSUPPORTED_PROJECT_OPTION_USE is enableR8.fullMode=false above (kept on
# purpose - see comment). LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED is a project-import
# perf suggestion whose only remedy is a flag AGP itself already deprecated on
# introduction (see commit history) - nothing left to actually change here.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.builtInKotlin=true
android.newDsl=true
